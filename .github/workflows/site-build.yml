name: Site build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Verify exported site contract
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const routeCandidates = {
            home: ["out/index.html"],
            notFound: ["out/404.html", "out/_not-found.html", "out/_not-found/index.html"],
            work: ["out/work.html", "out/work/index.html"],
            services: ["out/work-with-me.html", "out/work-with-me/index.html"],
            contact: ["out/contact.html", "out/contact/index.html"],
            sentinelTwin: [
              "out/work/sentineltwin.html",
              "out/work/sentineltwin/index.html",
            ],
            privacy: ["out/privacy.html", "out/privacy/index.html"],
            terms: ["out/terms.html", "out/terms/index.html"],
            refunds: ["out/refund-policy.html", "out/refund-policy/index.html"],
            delivery: ["out/delivery-policy.html", "out/delivery-policy/index.html"],
            sitemap: ["out/sitemap.xml"],
            robots: ["out/robots.txt"],
          };

          const failures = [];
          for (const [route, candidates] of Object.entries(routeCandidates)) {
            const exported = candidates.find(
              (candidate) => fs.existsSync(candidate) && fs.statSync(candidate).size > 100,
            );
            if (!exported) failures.push(`${route}: ${candidates.join(" or ")}`);
          }

          const forbiddenRoutes = ["out/admin.html", "out/admin/index.html"];
          for (const forbidden of forbiddenRoutes) {
            if (fs.existsSync(forbidden)) failures.push(`forbidden route exported: ${forbidden}`);
          }

          if (failures.length) {
            console.error("Static export contract failed:\n" + failures.join("\n"));
            process.exit(1);
          }

          const sitemap = fs.readFileSync("out/sitemap.xml", "utf8");
          for (const requiredUrl of [
            "https://pranaysuyash.com/work/sentineltwin",
            "https://pranaysuyash.com/privacy",
            "https://pranaysuyash.com/terms",
            "https://pranaysuyash.com/refund-policy",
            "https://pranaysuyash.com/delivery-policy",
          ]) {
            if (!sitemap.includes(requiredUrl)) {
              failures.push(`sitemap missing ${requiredUrl}`);
            }
          }

          if (failures.length) {
            console.error("Metadata contract failed:\n" + failures.join("\n"));
            process.exit(1);
          }

          const files = [];
          const walk = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(fullPath);
              else files.push(fullPath);
            }
          };
          walk("out");
          console.log(
            `Verified ${Object.keys(routeCandidates).length} required outputs across ${files.length} exported files.`,
          );
          NODE
