name: Site build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publication validation dependencies
        run: python -m pip install -r requirements-book.txt

      - name: Install application dependencies
        run: npm ci

      - name: Run canonical career-platform release contract
        shell: bash
        run: |
          set -o pipefail
          npm run site:verify 2>&1 | tee site-verify.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-verify-log-${{ github.sha }}
          path: site-verify.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload verified static export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-static-site-${{ github.sha }}
          path: out
          if-no-files-found: warn
          retention-days: 3