name: Site build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: site-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publication validation dependencies
        run: python -m pip install -r requirements-book.txt

      - name: Install application dependencies
        run: npm ci

      - name: Run canonical career-platform release contract
        id: canonical
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run site:verify 2>&1 | tee site-verify.log

      - name: Smoke-test the generated static export over HTTP
        id: smoke
        if: steps.canonical.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run site:smoke 2>&1 | tee site-smoke.log

      - name: Exercise hydrated desktop and mobile flows in Chrome
        id: browser
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run site:browser 2>&1 | tee site-browser.log

      - name: Publish canonical verification status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.canonical.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ] && [ "$SMOKE_OUTCOME" = "success" ] && [ "$BROWSER_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="Source, HTTP, and hydrated browser verification passed"
          elif [ "$VERIFY_OUTCOME" != "success" ]; then
            STATE="failure"
            DESCRIPTION="Canonical npm run site:verify failed"
          elif [ "$SMOKE_OUTCOME" != "success" ]; then
            STATE="failure"
            DESCRIPTION="Static export HTTP smoke test failed"
          else
            STATE="failure"
            DESCRIPTION="Hydrated browser release verification failed"
          fi

          jq -n \
            --arg state "$STATE" \
            --arg context "canonical-site-verify" \
            --arg description "$DESCRIPTION" \
            --arg target_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
            > status.json

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data-binary @status.json

      - name: Upload verification logs and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-verify-log-${{ github.sha }}
          path: |
            site-verify.log
            site-smoke.log
            site-browser.log
            browser-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified static export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-static-site-${{ github.sha }}
          path: out
          if-no-files-found: warn
          retention-days: 3

      - name: Fail workflow when any release verification failed
        if: steps.canonical.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.browser.outcome == 'failure'
        run: exit 1
