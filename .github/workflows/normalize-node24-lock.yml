name: Normalize Node 24 lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-node24-lock.yml"

permissions:
  contents: write

concurrency:
  group: normalize-node24-lock
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Reproduce lockfile with canonical npm
        run: >-
          npm exec --yes --package=npm@11.6.2 -- npm install
          --package-lock-only
          --ignore-scripts
          --no-audit
          --no-fund

      - name: Commit reviewed npm 11 metadata normalization
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches npm 11.6.2"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: normalize lockfile for npm 11"
          git push origin HEAD:main
