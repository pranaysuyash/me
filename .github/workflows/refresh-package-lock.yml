name: Refresh package lock once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh-package-lock-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh lockfile through canonical npm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate canonical package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Update only package-lock.json on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${{ github.repository }}/contents/package-lock.json?ref=main" |
              jq -r '.sha'
          )"

          jq -Rs \
            --arg message 'Commit npm-generated package lock' \
            --arg sha "$CURRENT_SHA" \
            --arg branch 'main' \
            '{message:$message,content:(@base64),sha:$sha,branch:$branch}' \
            package-lock.json > update-lock.json

          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/contents/package-lock.json" \
            --data-binary @update-lock.json
