name: Site diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-diagnostics-main
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PINNED_NPM_VERSION: "11.6.2"
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install book validation dependencies
        run: python -m pip install -r requirements-book.txt

      - name: Install Node dependencies with canonical npm
        run: npm exec --yes --package="npm@$PINNED_NPM_VERSION" -- npm ci

      - name: Run canonical site verification with a retained log
        shell: bash
        run: |
          set -o pipefail
          npm exec --yes --package="npm@$PINNED_NPM_VERSION" -- npm run site:verify 2>&1 | tee site-verify.log

      - name: Smoke-test the generated static export over HTTP
        shell: bash
        run: |
          set -o pipefail
          npm exec --yes --package="npm@$PINNED_NPM_VERSION" -- npm run site:smoke 2>&1 | tee site-smoke.log

      - name: Exercise hydrated desktop and mobile flows in Chrome
        shell: bash
        run: |
          set -o pipefail
          npm exec --yes --package="npm@$PINNED_NPM_VERSION" -- npm run site:browser 2>&1 | tee site-browser.log

      - name: Upload diagnostic logs and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-verify-log-${{ github.sha }}
          path: |
            site-verify.log
            site-smoke.log
            site-browser.log
            browser-artifacts
            toolchain.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload diagnostic static export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostic-static-site-${{ github.sha }}
          path: out
          if-no-files-found: warn
          retention-days: 3
