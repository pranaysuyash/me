name: Site diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-diagnostics-main
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install book validation dependencies
        run: python -m pip install -r requirements-book.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run canonical site verification with a retained log
        shell: bash
        run: |
          set -o pipefail
          npm run site:verify 2>&1 | tee site-verify.log

      - name: Smoke-test the generated static export over HTTP
        shell: bash
        run: |
          set -o pipefail
          npm run site:smoke 2>&1 | tee site-smoke.log

      - name: Exercise hydrated desktop and mobile flows in Chrome
        shell: bash
        run: |
          set -o pipefail
          npm run site:browser 2>&1 | tee site-browser.log

      - name: Upload diagnostic logs and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-verify-log-${{ github.sha }}
          path: |
            site-verify.log
            site-smoke.log
            site-browser.log
            browser-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Upload diagnostic static export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-static-site-${{ github.sha }}
          path: out
          if-no-files-found: warn
          retention-days: 3
