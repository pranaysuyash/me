name: Verification branch diagnostics

on:
  push:
    branches: [career-platform-final-gate]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

concurrency:
  group: verification-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out verification source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publication validation dependencies
        run: python -m pip install -r requirements-book.txt

      - name: Install application dependencies
        run: npm ci

      - name: Run canonical release contract
        id: canonical
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run site:verify 2>&1 | tee site-verify.log

      - name: Publish verification result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.canonical.outcome }}
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="Canonical npm run site:verify passed"
          else
            STATE="failure"
            DESCRIPTION="Canonical npm run site:verify failed; see PR comment"
          fi

          jq -n \
            --arg state "$STATE" \
            --arg context "canonical-site-verify" \
            --arg description "$DESCRIPTION" \
            --arg target_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
            > status.json

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data-binary @status.json

          {
            echo "Canonical verification outcome: **$VERIFY_OUTCOME**"
            echo
            echo "Source commit: `${{ github.sha }}`"
            echo
            echo '<details><summary>Last 180 log lines</summary>'
            echo
            echo '```text'
            tail -n 180 site-verify.log || true
            echo '```'
            echo '</details>'
          } > verification-comment.md

          jq -Rs '{body:.}' < verification-comment.md > comment.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/16/comments" \
            --data-binary @comment.json

      - name: Upload exact export and retained log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-verification-${{ github.sha }}
          path: |
            site-verify.log
            out
          if-no-files-found: warn
          retention-days: 3

      - name: Fail workflow when canonical verification failed
        if: steps.canonical.outcome == 'failure'
        run: exit 1
