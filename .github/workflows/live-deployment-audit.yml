name: Live deployment audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  workflow_run:
    workflows: ["Site build"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: live-deployment-audit-main
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve current main commit
        id: target
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify custom-domain deployment
        id: live
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          LIVE_SITE_URL: https://pranaysuyash.com
          LIVE_VERIFY_ATTEMPTS: "3"
          LIVE_VERIFY_DELAY_MS: "15000"
        run: node scripts/verify_live_deployment.mjs

      - name: Publish live deployment status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          VERIFY_OUTCOME: ${{ steps.live.outcome }}
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="Custom domain serves the current main release"
          else
            STATE="failure"
            DESCRIPTION="Custom domain does not serve the current main release"
          fi

          jq -n \
            --arg state "$STATE" \
            --arg context "live-deployment" \
            --arg description "$DESCRIPTION" \
            --arg target_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
            > status.json

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$TARGET_SHA" \
            --data-binary @status.json

      - name: Fail when live deployment is stale
        if: steps.live.outcome == 'failure'
        run: exit 1
