name: One-time stale PR branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-stale-pr-branches.yml

permissions:
  contents: write

concurrency:
  group: one-time-stale-pr-branch-cleanup
  cancel-in-progress: false

jobs:
  delete-audited-refs:
    if: github.repository == 'pranaysuyash/me'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the audited stale PR branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_ROOT: https://api.github.com/repos/${{ github.repository }}
        run: |
          set -euo pipefail

          branches=(
            career-platform-verification
            career-platform-verification-3
            career-platform-verification-4
            career-platform-verification-5
            career-platform-visual-verification
            career-platform-visual-fix-verification
            career-platform-final-proof
            career-platform-10-verification
            career-platform-quality-verification
            career-platform-10-final-verification
            career-platform-canonical-verification
            career-platform-d902-verification
            career-platform-final-gate
          )

          for branch in "${branches[@]}"; do
            response_file="response-${branch}.json"
            status="$({ curl --silent --show-error \
              -o "$response_file" \
              -w '%{http_code}' \
              -X DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/git/refs/heads/$branch"; } || true)"

            case "$status" in
              204)
                echo "deleted $branch"
                ;;
              404)
                echo "already absent $branch"
                ;;
              *)
                echo "failed to delete $branch: HTTP $status"
                cat "$response_file" || true
                exit 1
                ;;
            esac
          done
