    <path d="M17 29l7 7 16-18" fill="none" stroke="#59d7cb" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
    <text x="76" y="38" fill="#a9bdb9" font-family="Arial, Helvetica, sans-serif" font-size="31">Evidence links · Eval contracts · Review rules</text>
