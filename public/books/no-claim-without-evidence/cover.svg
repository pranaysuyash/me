<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">No Claim Without Evidence book cover</title>
  <desc id="desc">Dark editorial book cover for No Claim Without Evidence by Pranay Suyash.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102426"/>
      <stop offset="0.62" stop-color="#081214"/>
      <stop offset="1" stop-color="#04090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.58">
      <stop offset="0" stop-color="#59d7cb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#59d7cb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#dff7f3" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <rect width="1200" height="1800" fill="url(#glow)"/>
