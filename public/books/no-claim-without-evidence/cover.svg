  <text x="112" y="470" fill="#f4fbf9" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-5">
    <tspan x="112" dy="0">NO CLAIM</tspan>
    <tspan x="112" dy="116">WITHOUT</tspan>
    <tspan x="112" dy="116">EVIDENCE</tspan>
  </text>
  <line x1="112" y1="880" x2="1088" y2="880" stroke="#59d7cb" stroke-width="4"/>
  <text x="112" y="980" fill="#d6e5e2" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="500">
