<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MetaExtract evidence-linked extraction workflow</title>
  <desc id="desc">Mixed files move through format-aware extraction, normalization, validation, and a reviewer queue while preserving field provenance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1d1e"/><stop offset="1" stop-color="#071011"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9e4b9"/><stop offset="1" stop-color="#62b886"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#7bd09b"/></marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="62" y="72" fill="#f6fbf8" font-family="Arial, sans-serif" font-size="28" font-weight="700">MetaExtract</text>
  <text x="62" y="106" fill="#d6e7df" fill-opacity=".58" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">EVIDENCE-LINKED DOCUMENT INTELLIGENCE</text>
  <g transform="translate(58 160)">
    <text x="0" y="0" fill="#b7ccc3" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.5">MIXED INPUTS</text>
    <g transform="translate(0 32)" filter="url(#shadow)">
      <rect x="36" y="0" width="210" height="286" rx="18" fill="#dfe6e0" opacity=".22" transform="rotate(5 141 143)"/>
      <rect x="18" y="10" width="210" height="286" rx="18" fill="#e9efe9" opacity=".48" transform="rotate(-3 123 153)"/>
      <rect width="210" height="286" rx="18" fill="#f2f4ef"/>
      <rect x="24" y="30" width="112" height="12" rx="6" fill="#4a5b56" fill-opacity=".3"/>
      <rect x="24" y="66" width="162" height="8" rx="4" fill="#4a5b56" fill-opacity=".16"/>
      <rect x="24" y="89" width="148" height="8" rx="4" fill="#4a5b56" fill-opacity=".16"/>
      <rect x="24" y="118" width="162" height="72" rx="10" fill="#6aa982" fill-opacity=".16" stroke="#6aa982" stroke-dasharray="5 5"/>
      <path d="M38 142h56M38 160h128M38 178h92" stroke="#3f6551" stroke-width="6" stroke-linecap="round" opacity=".55"/>
      <text x="24" y="232" fill="#26322f" font-family="Arial, sans-serif" font-size="14" font-weight="700">PDF · scan · image · file</text>
      <text x="24" y="258" fill="#53645f" font-family="Arial, sans-serif" font-size="12">Variable format and structure</text>
    </g>
    <g transform="translate(18 354)">
      <rect width="210" height="92" rx="14" fill="#172c2b" stroke="#fff" stroke-opacity=".1"/>
      <text x="20" y="32" fill="#eff8f3" font-family="Arial, sans-serif" font-size="14" font-weight="700">Source identity</text>
      <text x="20" y="57" fill="#b8cbc3" font-family="Arial, sans-serif" font-size="12">Hash · file type · page</text>
      <text x="20" y="76" fill="#b8cbc3" font-family="Arial, sans-serif" font-size="12">location · extractor</text>
    </g>
  </g>
  <path d="M310 347H382" stroke="#7bd09b" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(394 150)">
    <text x="0" y="10" fill="#b7ccc3" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.5">FORMAT-AWARE PIPELINE</text>
    <g transform="translate(0 42)">
      <rect width="322" height="390" rx="22" fill="#112625" stroke="#fff" stroke-opacity=".11"/>
      <g transform="translate(24 28)"><rect width="274" height="66" rx="12" fill="#193432"/><circle cx="32" cy="33" r="13" fill="#7bd09b"/><text x="58" y="28" fill="#f4fbf7" font-family="Arial, sans-serif" font-size="15" font-weight="700">Detect structure</text><text x="58" y="49" fill="#b5c9c1" font-family="Arial, sans-serif" font-size="12">Native text, layout, metadata</text></g>
      <path d="M161 98V116" stroke="#7bd09b" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(24 124)"><rect width="274" height="66" rx="12" fill="#193432"/><circle cx="32" cy="33" r="13" fill="#7bd09b"/><text x="58" y="28" fill="#f4fbf7" font-family="Arial, sans-serif" font-size="15" font-weight="700">Extract fields</text><text x="58" y="49" fill="#b5c9c1" font-family="Arial, sans-serif" font-size="12">Rules, parsers, OCR, models</text></g>
      <path d="M161 194V212" stroke="#7bd09b" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(24 220)"><rect width="274" height="66" rx="12" fill="#193432"/><circle cx="32" cy="33" r="13" fill="#7bd09b"/><text x="58" y="28" fill="#f4fbf7" font-family="Arial, sans-serif" font-size="15" font-weight="700">Normalize</text><text x="58" y="49" fill="#b5c9c1" font-family="Arial, sans-serif" font-size="12">Stable schema and aliases</text></g>
      <path d="M161 290V308" stroke="#7bd09b" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(24 316)"><rect width="274" height="50" rx="12" fill="#7bd09b" fill-opacity=".14" stroke="#7bd09b" stroke-opacity=".5"/><text x="20" y="31" fill="#c9f0d5" font-family="Arial, sans-serif" font-size="14" font-weight="700">Validate · never silently infer</text></g>
    </g>
  </g>
  <path d="M730 347H802" stroke="#7bd09b" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(816 150)">
    <text x="0" y="10" fill="#b7ccc3" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.5">REVIEWABLE OUTPUT</text>
    <rect y="42" width="326" height="390" rx="22" fill="#112625" stroke="#fff" stroke-opacity=".11"/>
    <g transform="translate(22 66)"><rect width="282" height="70" rx="12" fill="#193432"/><text x="18" y="26" fill="#f4fbf7" font-family="Arial, sans-serif" font-size="13" font-weight="700">invoice_total</text><text x="18" y="50" fill="#a9e4b9" font-family="Arial, sans-serif" font-size="18" font-weight="700">₹ 48,250.00</text><rect x="202" y="20" width="60" height="24" rx="12" fill="#7bd09b" fill-opacity=".17"/><text x="216" y="36" fill="#baf0cb" font-family="Arial, sans-serif" font-size="11">0.97</text></g>
    <g transform="translate(22 150)"><rect width="282" height="70" rx="12" fill="#193432"/><text x="18" y="26" fill="#f4fbf7" font-family="Arial, sans-serif" font-size="13" font-weight="700">due_date</text><text x="18" y="50" fill="#f4fbf7" font-family="Arial, sans-serif" font-size="18" font-weight="700">27 Jun 2025</text><rect x="202" y="20" width="60" height="24" rx="12" fill="#d9ad62" fill-opacity=".17"/><text x="216" y="36" fill="#f1cd91" font-family="Arial, sans-serif" font-size="11">0.71</text></g>
    <g transform="translate(22 234)"><rect width="282" height="70" rx="12" fill="#193432"/><text x="18" y="26" fill="#f4fbf7" font-family="Arial, sans-serif" font-size="13" font-weight="700">tax_id</text><text x="18" y="50" fill="#f4fbf7" font-family="Arial, sans-serif" font-size="18" font-weight="700">Evidence required</text><rect x="202" y="20" width="60" height="24" rx="12" fill="#e07b68" fill-opacity=".18"/><text x="216" y="36" fill="#f3a899" font-family="Arial, sans-serif" font-size="11">review</text></g>
    <g transform="translate(22 320)"><rect width="282" height="86" rx="13" fill="#7bd09b" fill-opacity=".09" stroke="#7bd09b" stroke-opacity=".4"/><path d="M22 24h22v22H22zM27 35l5 5 8-12" fill="none" stroke="#9de2b4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="32" fill="#dff7e7" font-family="Arial, sans-serif" font-size="14" font-weight="700">Human review queue</text><text x="58" y="55" fill="#b8d7c6" font-family="Arial, sans-serif" font-size="12">Only exceptions need attention</text><text x="58" y="73" fill="#b8d7c6" font-family="Arial, sans-serif" font-size="12">Each field retains provenance</text></g>
  </g>
  <g transform="translate(392 596)"><rect width="420" height="62" rx="31" fill="url(#green)" fill-opacity=".11" stroke="#7bd09b" stroke-opacity=".42"/><text x="26" y="26" fill="#c9f0d5" font-family="Arial, sans-serif" font-size="14" font-weight="700">Coverage ≠ correctness</text><text x="26" y="47" fill="#c9f0d5" fill-opacity=".64" font-family="Arial, sans-serif" font-size="12">Evidence and review remain visible by field</text></g>
</svg>
