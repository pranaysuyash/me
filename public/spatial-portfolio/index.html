<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Pranay Suyash — Interactive product systems map</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7fbfa;
        --muted: rgba(232, 246, 242, 0.62);
        --panel: rgba(8, 17, 19, 0.82);
        --line: rgba(129, 223, 208, 0.28);
        --cyan: #59d7cb;
        --amber: #d69c59;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgba(44, 126, 117, 0.22), transparent 42%),
          linear-gradient(160deg, #0d1718 0%, #081012 55%, #050b0d 100%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      #scene {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 500px;
        isolation: isolate;
      }

      canvas,
      .label-layer {
        position: absolute;
        inset: 0;
        display: block;
      }

      canvas {
        pointer-events: none;
      }

      .label-layer {
        pointer-events: auto;
        touch-action: none;
      }

      .scene-kicker,
      .scene-help {
        position: absolute;
        z-index: 5;
        pointer-events: none;
      }

      .scene-kicker {
        top: 18px;
        left: 18px;
      }

      .scene-kicker strong,
      .scene-kicker span {
        display: block;
      }

      .scene-kicker strong {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(198, 245, 237, 0.72);
      }

      .scene-kicker span {
        margin-top: 5px;
        max-width: 240px;
        font-size: 12px;
        line-height: 1.45;
        color: rgba(232, 246, 242, 0.48);
      }

      .scene-help {
        right: 16px;
        bottom: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(4, 10, 12, 0.68);
        padding: 7px 10px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(232, 246, 242, 0.45);
        backdrop-filter: blur(10px);
      }

      .system-label {
        display: block;
        width: 158px;
        pointer-events: auto;
        text-decoration: none;
        color: var(--ink);
        transform: translate(-50%, -50%);
      }

      .system-label__inner {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
        padding: 10px 11px;
        backdrop-filter: blur(14px);
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .system-label:hover .system-label__inner,
      .system-label:focus-visible .system-label__inner,
      .system-label[data-active="true"] .system-label__inner {
        transform: translateY(-2px) scale(1.025);
        border-color: rgba(89, 215, 203, 0.62);
        background: rgba(8, 22, 24, 0.94);
      }

      .system-label:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 4px;
        border-radius: 10px;
      }

      .system-label__eyebrow {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(150, 231, 219, 0.64);
      }

      .system-label__title {
        margin-top: 4px;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: -0.015em;
      }

      .system-label__proof {
        margin-top: 5px;
        font-size: 10px;
        line-height: 1.35;
        color: var(--muted);
      }

      .core-label {
        width: 176px;
        pointer-events: none;
      }

      .core-label .system-label__inner {
        border-color: rgba(214, 156, 89, 0.34);
        background: rgba(13, 20, 20, 0.9);
        text-align: center;
      }

      .core-label .system-label__eyebrow {
        color: rgba(232, 190, 135, 0.76);
      }

      .unsupported {
        position: absolute;
        inset: 20px;
        z-index: 9;
        display: none;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: rgba(5, 12, 14, 0.94);
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }

      .unsupported strong {
        display: block;
        margin-bottom: 7px;
        color: var(--ink);
      }

      @media (max-width: 520px) {
        #scene {
          min-height: 440px;
        }

        .system-label {
          width: 132px;
        }

        .system-label__proof {
          display: none;
        }

        .scene-help {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .system-label__inner {
          transition: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="scene" aria-label="Interactive map of flagship product systems">
      <div class="scene-kicker" aria-hidden="true">
        <strong>System map</strong>
        <span>Four product surfaces connected by one operating discipline.</span>
      </div>
      <div class="scene-help" aria-hidden="true">Drag to inspect · open a label</div>
      <div id="unsupported" class="unsupported" role="status">
        <div>
          <strong>Interactive scene unavailable</strong>
          The portfolio and case-study links remain available in the surrounding page.
        </div>
      </div>
    </main>
    <script type="module" src="./scene.js"></script>
  </body>
</html>
