<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Release gate for AI workflow changes</title>
  <desc id="desc">A diagram showing changes flowing through evals, thresholds, waivers, and a ship or block decision.</desc>
  <rect width="1200" height="560" fill="#101820"/>
  <text x="70" y="72" fill="#F7F2E8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Release Gate</text>
  <text x="70" y="110" fill="#A8B4BE" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18">The eval should decide whether a change is safe enough to ship.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#D8A33A"/>
    </marker>
  </defs>
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <rect x="70" y="185" width="220" height="210" rx="10" fill="#FFFDF8"/>
    <text x="105" y="230" fill="#101820" font-size="24" font-weight="700">Change</text>
    <text x="105" y="272" fill="#3C4650" font-size="18">prompt</text>
    <text x="105" y="302" fill="#3C4650" font-size="18">model</text>
    <text x="105" y="332" fill="#3C4650" font-size="18">schema</text>
    <text x="105" y="362" fill="#3C4650" font-size="18">routing rule</text>
    <rect x="390" y="170" width="250" height="240" rx="10" fill="#EFE7D8"/>
    <text x="425" y="215" fill="#101820" font-size="24" font-weight="700">Eval Evidence</text>
    <text x="425" y="258" fill="#3C4650" font-size="18">ground truth version</text>
    <text x="425" y="288" fill="#3C4650" font-size="18">regression set</text>
    <text x="425" y="318" fill="#3C4650" font-size="18">risk thresholds</text>
    <text x="425" y="348" fill="#3C4650" font-size="18">waivers</text>
    <rect x="740" y="150" width="180" height="120" rx="10" fill="#EAF8FC" stroke="#21C4F3" stroke-width="2"/>
    <text x="783" y="204" fill="#101820" font-size="24" font-weight="700">Ship</text>
    <text x="770" y="236" fill="#3C4650" font-size="17">with report</text>
    <rect x="740" y="330" width="180" height="120" rx="10" fill="#FBE9E6" stroke="#D9534F" stroke-width="2"/>
    <text x="783" y="384" fill="#101820" font-size="24" font-weight="700">Block</text>
    <text x="770" y="416" fill="#3C4650" font-size="17">with work item</text>
    <rect x="995" y="238" width="135" height="124" rx="10" fill="#102331" stroke="#D8A33A" stroke-width="2"/>
    <text x="1025" y="292" fill="#F7F2E8" font-size="22" font-weight="700">Audit</text>
    <text x="1024" y="324" fill="#D8A33A" font-size="17">why?</text>
  </g>
  <path d="M292 290 H376" stroke="#D8A33A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M642 260 C684 240 704 216 736 205" stroke="#D8A33A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M642 320 C684 346 704 376 736 390" stroke="#D8A33A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M922 210 C963 228 980 256 992 284" stroke="#D8A33A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M922 390 C962 372 980 344 992 316" stroke="#D8A33A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
</svg>
