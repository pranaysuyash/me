<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Evidence trail from claim to action</title>
  <desc id="desc">A deterministic diagram showing a claim connected to source evidence, status, and workflow action.</desc>
  <rect width="1200" height="520" fill="#071017"/>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#21C4F3"/>
    </marker>
  </defs>
  <text x="60" y="68" fill="#F7F2E8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Evidence Trail</text>
  <text x="60" y="104" fill="#A8B4BE" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18">Every product claim needs source evidence, status, and a workflow action.</text>
  <g font-family="Inter, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <rect x="70" y="178" width="210" height="150" rx="8" fill="#FFFDF8"/>
    <text x="100" y="224" fill="#101820" font-size="22" font-weight="700">Claim</text>
    <text x="100" y="262" fill="#3C4650" font-size="18">terminal =</text>
    <text x="100" y="292" fill="#B27A17" font-size="22" font-weight="700">Terminal 3</text>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <rect x="370" y="168" width="240" height="170" rx="8" fill="#EFE7D8"/>
    <text x="400" y="214" fill="#101820" font-size="22" font-weight="700">Source Evidence</text>
    <rect x="400" y="242" width="160" height="10" rx="5" fill="#A8B4BE"/>
    <rect x="400" y="270" width="120" height="10" rx="5" fill="#A8B4BE"/>
    <rect x="400" y="298" width="0" height="10" rx="5" fill="#D9534F"/>
    <text x="400" y="326" fill="#D9534F" font-size="17" font-weight="700">no terminal span</text>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <rect x="700" y="178" width="200" height="150" rx="8" fill="#FFFDF8"/>
    <text x="730" y="224" fill="#101820" font-size="22" font-weight="700">Status</text>
    <text x="730" y="270" fill="#D9534F" font-size="20" font-weight="700">unsupported</text>
    <text x="730" y="300" fill="#3C4650" font-size="16">not extracted</text>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <rect x="990" y="168" width="150" height="170" rx="8" fill="#102331" stroke="#21C4F3" stroke-width="2"/>
    <text x="1020" y="214" fill="#F7F2E8" font-size="22" font-weight="700">Action</text>
    <text x="1020" y="260" fill="#21C4F3" font-size="19" font-weight="700">reject</text>
    <text x="1020" y="290" fill="#F7F2E8" font-size="16">or review</text>
  </g>
  <path d="M285 253 H356" stroke="#21C4F3" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M615 253 H686" stroke="#21C4F3" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M905 253 H976" stroke="#21C4F3" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="70" y="430" fill="#F7F2E8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Rule</text>
  <text x="70" y="464" fill="#A8B4BE" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19">A clean value without source evidence is not an extraction. It is an unsupported claim.</text>
</svg>
